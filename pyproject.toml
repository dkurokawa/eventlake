[project]
name = "eventlake"
version = "0.1.0"
description = "A small event lake: typed events appended to partitioned Parquet, queryable as of any point in time via DuckDB."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # 2.5.0: the lowest version verified (full test suite, this project's
    # actual usage of ConfigDict/model_validator/__pydantic_init_subclass__)
    # to install as a prebuilt wheel and pass, on Python 3.11-3.13.
    "pydantic>=2.5.0",
    # 16.0.0: the lowest version verified against the numpy this environment
    # resolves; 14.x hits a pyarrow/numpy ABI mismatch ("_ARRAY_API not
    # found") with a current numpy, so pin above that boundary.
    "pyarrow>=16.0.0",
    # 1.5.0: verified empirically - 1.4.x and earlier drop the connection
    # underneath a still-live relation in exactly the pattern this library
    # uses (`Lake(root).events(...).to_arrow_table()`, with no variable
    # holding the Lake itself): the connection gets garbage collected
    # before the relation is done with it, raising "Connection has already
    # been closed". Fixed in 1.5.0.
    "duckdb>=1.5.0",
    "pytz>=2026.4",
]

[project.optional-dependencies]
s3 = [
    # 1.35.2: the lowest version whose PutObject model has `IfNoneMatch`
    # (S3 conditional writes), which is how a schema version is claimed
    # exclusively. 1.35.1 and earlier reject the parameter client-side
    # (checked with botocore pinned to the same version).
    "boto3>=1.35.2",
]

[project.scripts]
eventlake = "eventlake.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # 6.70.0: hypothesis==6.0.0 (the plain ">=6" floor) crashes on import
    # under Python 3.11/3.12 (`EntryPoints.get` was removed from stdlib
    # importlib.metadata); verified 6.70.0 imports and the suite passes.
    "hypothesis>=6.70.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # The S3 backend's tests run against moto's in-process S3 server.
    "boto3>=1.35.2",
    # 5.0.15: the lowest moto whose S3 server honours PutObject
    # `IfNoneMatch` (412 on an existing key); 5.0.14 and earlier let the
    # second write through, which would hide the exclusive-create logic.
    "moto[server]>=5.0.15",
    "boto3-stubs[s3]>=1.35.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eventlake"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["eventlake"]
