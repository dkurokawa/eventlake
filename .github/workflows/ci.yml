name: CI

# Network access: the S3 tests read through DuckDB's `httpfs` extension, which
# DuckDB downloads from extensions.duckdb.org the first time it is installed
# (the "Fetch the DuckDB httpfs extension" step). The S3 server itself is an
# in-process moto server on 127.0.0.1 - no AWS account, credentials or bucket.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Fetch the DuckDB httpfs extension (needs network)
        run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL httpfs')"

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy --strict eventlake

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=eventlake --cov-fail-under=90

  test-lowest-direct:
    # Pins every dependency to the lowest version its declared constraint
    # allows, to catch a floor that's stated but doesn't actually work (see
    # the comments on the dependency floors in pyproject.toml - several of
    # them exist precisely because this job would otherwise have caught a
    # real breakage before it did, empirically).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install dependencies at the lowest allowed versions
        run: uv sync --resolution lowest-direct --all-groups

      - name: Fetch the DuckDB httpfs extension (needs network)
        run: uv run --resolution lowest-direct python -c "import duckdb; duckdb.connect().execute('INSTALL httpfs')"

      - name: Test (pytest, no coverage gate - this job is about the floor, not coverage)
        run: uv run --resolution lowest-direct pytest

  test-without-s3:
    # The local backend must not need boto3: remove it (and moto) after the
    # normal install and run the suite. The S3 tests skip themselves when
    # boto3 / moto are missing, so what is left is everything local.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install dependencies, then remove the S3 packages
        run: |
          uv sync --locked --all-groups
          uv pip uninstall boto3 botocore moto boto3-stubs s3transfer

      - name: Test (pytest, S3 tests skipped)
        run: uv run --no-sync pytest -rs
