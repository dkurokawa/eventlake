name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy --strict eventlake

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=eventlake --cov-fail-under=90

  test-lowest-direct:
    # Pins every dependency to the lowest version its declared constraint
    # allows, to catch a floor that's stated but doesn't actually work (see
    # the comments on the dependency floors in pyproject.toml - several of
    # them exist precisely because this job would otherwise have caught a
    # real breakage before it did, empirically).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install dependencies at the lowest allowed versions
        run: uv sync --resolution lowest-direct --all-groups

      - name: Test (pytest, no coverage gate - this job is about the floor, not coverage)
        run: uv run --resolution lowest-direct pytest
